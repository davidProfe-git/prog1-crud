<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Interface</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
}

.card{
    width:350px;
    padding:40px;
    border-radius:20px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    color:white;
    text-align:center;
    animation: float 4s ease-in-out infinite;
}

.card h1{
    margin-bottom:10px;
    font-size:28px;
    letter-spacing:1px;
}

.card p{
    font-size:14px;
    opacity:0.8;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background: rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
    transition:0.3s;
}

input::placeholder{
    color:rgba(255,255,255,0.7);
}

input:focus{
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background: linear-gradient(45deg,#ff6b6b,#f06595);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

@keyframes float{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-15px); }
}
</style>
</head>

<body>

<div class="card">
    <h1>Bienvenido</h1>
    <p>Interfaz moderna con efecto Glassmorphism</p>

    <div class="input-group">
        <input type="text" placeholder="Usuario">
    </div>

    <div class="input-group">
        <input type="password" placeholder="Contraseña">
    </div>

    <button>Iniciar Sesión</button>
</div>

</body>
</html>
