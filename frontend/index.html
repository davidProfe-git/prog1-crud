<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackout Keycards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h2 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }

        .card-body p {
            margin: 5px 0;
        }

        .rareza {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Blackout Keycards</h1>
    <div id="tarjetas"></div>

    <script>
        // Traer datos desde la API del backend
        fetch('/api/keycards')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('tarjetas');
                data.forEach(t => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${t.imagen_url}" alt="${t.nombre}">
                            <div class="card-body">
                                <h2>${t.nombre}</h2>
                                <p><strong>Usos:</strong> ${t.usos}</p>
                                <p><strong>Valor:</strong> $${t.valor}</p>
                                <p class="rareza"><strong>Rareza:</strong> ${t.rareza}</p>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => console.error('Error cargando las tarjetas:', err));
    </script>

</body>
</html>
