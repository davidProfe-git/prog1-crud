<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BLACKOUT — Arsenal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="noise"></div>
    <div class="scanlines"></div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-main">BLACKOUT</span>
                <span class="logo-sub">// ARSENAL DATABASE</span>
            </div>
            <div class="status-bar">
                <span class="status-dot"></span>
                <span class="status-text">CONNECTED</span>
            </div>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-tab="keycards">
            <span class="tab-icon">⬡</span> KEYCARDS
        </button>
        <button class="tab" data-tab="melee">
            <span class="tab-icon">⚔</span> MELEE
        </button>
        <button class="tab" data-tab="fire">
            <span class="tab-icon">⊕</span> FIRE WEAPONS
        </button>
    </nav>

    <main>
        <!-- KEYCARDS -->
        <section id="keycards" class="panel active">
            <div class="panel-header">
                <h2>ACCESS KEYCARDS</h2>
                <p class="panel-desc">Tarjetas de acceso para zonas restringidas del mapa</p>
            </div>
            <div class="grid" id="keycards-grid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </section>

        <!-- MELEE WEAPONS -->
        <section id="melee" class="panel">
            <div class="panel-header">
                <h2>MELEE WEAPONS</h2>
                <p class="panel-desc">Armas cuerpo a cuerpo — letales en distancia corta</p>
            </div>
            <div class="grid" id="melee-grid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </section>

        <!-- FIRE WEAPONS -->
        <section id="fire" class="panel">
            <div class="panel-header">
                <h2>FIRE WEAPONS</h2>
                <p class="panel-desc">Armamento de fuego — domina el campo de batalla</p>
            </div>
            <div class="grid" id="fire-grid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </section>
    </main>

    <!-- ✅ Script UNA sola vez, al final del body, con la ruta correcta -->
    <script src="js/app.js"></script>
</body>
</html>
